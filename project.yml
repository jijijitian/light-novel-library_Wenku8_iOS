name: Wenku8
options:
  bundleIdPrefix: org.mewx.wenku8
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: C428Z585GG
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # The core module is a plain framework target rather than a SwiftPM product so
  # that Xcode never has to resolve the package graph (that path needs a writable
  # ~/Library/Caches). The SwiftPM package is untouched and still drives
  # `swift test` and CI.
  Wenku8Core:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Wenku8Core
    resources:
      - path: Sources/Wenku8Core/Resources/gbk-table.bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mewx.wenku8.ios.core
        PRODUCT_NAME: Wenku8Core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Wenku8:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Wenku8iOS
    resources:
      - path: Support/PrivacyInfo.xcprivacy
      - path: Support/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mewx.wenku8.ios
        PRODUCT_NAME: Wenku8
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Wenku8Core
        embed: true

schemes:
  Wenku8:
    build:
      targets:
        Wenku8: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
