name: Wenku8
options:
  bundleIdPrefix: org.mewx.wenku8
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: C428Z585GG
    CODE_SIGN_STYLE: Automatic
    # XcodeGen injects the legacy "iPhone Developer" identity, which no longer
    # matches any certificate on current Xcode. Naming the modern identity
    # explicitly fixes device builds; leaving it empty disables signing entirely.
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # The core module is a plain framework target rather than a SwiftPM product so
  # that Xcode never has to resolve the package graph (that path needs a writable
  # ~/Library/Caches). The SwiftPM package is untouched and still drives
  # `swift test` and CI.
  Wenku8Core:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Wenku8Core
      # XcodeGen has no `resources:` key on a target: files are declared through
      # `sources` and routed to a build phase by extension, so the GBK table is
      # listed here and lands in the framework bundle.
      - path: Sources/Wenku8Core/Resources/gbk-table.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mewx.wenku8.ios.core
        PRODUCT_NAME: Wenku8Core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Wenku8:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Wenku8iOS
      - path: Support/Assets.xcassets
        buildPhase: resources
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mewx.wenku8.ios
        PRODUCT_NAME: Wenku8
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Wenku8Core
        embed: true

schemes:
  Wenku8:
    build:
      targets:
        Wenku8: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
