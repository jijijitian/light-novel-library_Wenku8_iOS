name: iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux Swift)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run parser and decoding tests
        run: bash tools/test-core-linux.sh

  build:
    name: Xcode build (${{ matrix.label }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS 26 SDK
            runner: macos-26
            expect_sdk: "26"
            artifact: Wenku8-unsigned-ios26
          - label: iOS 27 SDK
            runner: xcode-27
            expect_sdk: "27"
            artifact: Wenku8-unsigned-ios27
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "--- iOS SDKs on this runner ---"
          xcodebuild -showsdks -json | tee sdks.json
          SDK_VERSION=$(xcrun -sdk iphoneos --show-sdk-version)
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          case "$SDK_VERSION" in
            ${{ matrix.expect_sdk }}.*) echo "matches expected major ${{ matrix.expect_sdk }}" ;;
            *) echo "expected iOS ${{ matrix.expect_sdk }} SDK, got $SDK_VERSION"; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d Wenku8.xcodeproj
          # The project is generated, never committed: a checked-in pbxproj would
          # drift from project.yml and from the source tree.
          git status --porcelain | grep -v '^?? Wenku8.xcodeproj' || true

      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Wenku8.xcodeproj \
            -scheme Wenku8 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          test -n "$APP"
          echo "--- Info.plist ---"
          plutil -p "$APP/Info.plist"
          echo "--- bundle tree ---"
          find "$APP" -maxdepth 2 | sort
          test -x "$APP/Wenku8"
          echo "CFBundleIdentifier=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "MinimumOSVersion=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")"
          test -f "$APP/AppIcon60x60@2x.png" || test -f "$APP/Assets.car"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/gbk-table.bin"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -q 'org.mewx.wenku8.ios'

      - name: Verify executable entry point and frameworks
        run: |
          set -euo pipefail
          BIN="$APP/Wenku8"
          echo "--- architecture ---"
          file "$BIN"
          lipo -info "$BIN"
          echo "--- min OS recorded in the Mach-O ---"
          otool -l "$BIN" > macho-load-commands.txt
          if grep -q "LC_BUILD_VERSION" macho-load-commands.txt; then
            # platform 2 = iOS
            grep -A 4 "LC_BUILD_VERSION" macho-load-commands.txt > buildversion.txt
            cat buildversion.txt
            grep -q "platform 2" buildversion.txt
          else
            grep "LC_VERSION_MIN_IPHONEOS" macho-load-commands.txt
          fi
          echo "--- entry point symbol ---"
          # Write to files first: piping a tool into `grep -q` can make the tool die
          # of SIGPIPE and fail the step even when the match succeeded.
          nm -gU "$BIN" > symbols.txt
          grep -E "(_main|_main$)" symbols.txt
          echo "--- linked frameworks ---"
          otool -L "$BIN" > frameworks.txt
          grep "SwiftUI.framework" frameworks.txt
          grep "UIKit.framework" frameworks.txt
          echo "--- liquid glass support in the built binary ---"
          echo "built against iOS $SDK_VERSION SDK"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          rm -rf Payload Wenku8-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Wenku8-unsigned.ipa Payload
          ls -lh Wenku8-unsigned.ipa
          shasum -a 256 Wenku8-unsigned.ipa | tee ipa.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Wenku8-unsigned.ipa
            ipa.sha256
            build.log
            sdks.json
          if-no-files-found: error
