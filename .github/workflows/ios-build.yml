name: iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux Swift)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run parser and decoding tests
        run: bash tools/test-core-linux.sh

  build:
    name: xtool build (${{ matrix.label }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS 27 SDK
            runner: xcode-27
            expect_sdk: "27"
            artifact: Wenku8iOS-unsigned-ios27
          - label: iOS 26 SDK
            runner: macos-26
            expect_sdk: "26"
            artifact: Wenku8iOS-unsigned-ios26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "--- iOS SDKs on this runner ---"
          xcodebuild -showsdks -json | tee sdks.json
          SDK_PATH=$(xcrun -sdk iphoneos -show-sdk-path)
          echo "SDK_PATH=$SDK_PATH"
          SDK_VERSION=$(xcrun -sdk iphoneos --show-sdk-version)
          echo "SDK_VERSION=$SDK_VERSION"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          case "$SDK_VERSION" in
            ${{ matrix.expect_sdk }}.*) echo "matches expected major ${{ matrix.expect_sdk }}" ;;
            *) echo "expected iOS ${{ matrix.expect_sdk }} SDK, got $SDK_VERSION"; exit 1 ;;
          esac

      - name: Install xtool
        run: |
          set -euo pipefail
          brew install xtool-org/tap/xtool
          xtool --help | head -20

      - name: Build app bundle
        run: |
          set -euo pipefail
          xtool dev build --configuration release 2>&1 | tee build.log
          test -d xtool/Wenku8iOS.app
          echo "built with iOS $SDK_VERSION SDK" | tee -a build.log

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          APP=xtool/Wenku8iOS.app
          echo "--- Info.plist ---"
          plutil -p "$APP/Info.plist"
          echo "--- bundle tree ---"
          find "$APP" -maxdepth 2 | sort
          test -x "$APP/Wenku8iOS"
          echo "CFBundleIdentifier=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "MinimumOSVersion=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")"
          test -f "$APP/AppIcon.png"

      - name: Verify executable entry point and frameworks
        run: |
          set -euo pipefail
          APP=xtool/Wenku8iOS.app
          BIN="$APP/Wenku8iOS"
          echo "--- architecture ---"
          file "$BIN"
          lipo -info "$BIN"
          echo "--- min OS recorded in the Mach-O ---"
          otool -l "$BIN" | tee macho-load-commands.txt >/dev/null
          if grep -q "LC_BUILD_VERSION" macho-load-commands.txt; then
            # platform 2 = iOS
            grep -A 4 "LC_BUILD_VERSION" macho-load-commands.txt | tee buildversion.txt
            grep -q "platform 2" buildversion.txt
          else
            grep "LC_VERSION_MIN_IPHONEOS" macho-load-commands.txt
          fi
          echo "--- entry point symbol ---"
          nm -gU "$BIN" | grep -E "(_main|_main$)"
          echo "--- linked frameworks ---"
          otool -L "$BIN" | tee frameworks.txt
          grep -q "SwiftUI.framework" frameworks.txt
          grep -q "UIKit.framework" frameworks.txt
          echo "--- resource bundle name ---"
          ls -d "$APP"/*.bundle
          strings "$BIN" | grep -q "Wenku8iOS_Wenku8Core.bundle"
          echo "--- Liquid Glass API availability ---"
          # glassEffect/GlassEffectContainer are iOS 26+, so the built binary must
          # still build against a matching SDK; record which one was used.
          echo "built against iOS $SDK_VERSION SDK"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          chmod -R 755 xtool/Wenku8iOS.app
          rm -rf Payload Wenku8iOS-unsigned.ipa
          mkdir -p Payload
          cp -R xtool/Wenku8iOS.app Payload/
          zip -qry Wenku8iOS-unsigned.ipa Payload
          ls -lh Wenku8iOS-unsigned.ipa
          shasum -a 256 Wenku8iOS-unsigned.ipa | tee ipa.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Wenku8iOS-unsigned.ipa
            ipa.sha256
            build.log
            sdks.json
          if-no-files-found: error
